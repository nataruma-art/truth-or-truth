<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truth or Truth? 🤫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFD1D1, #FFE3E3, #FFF5F5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            touch-action: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3D Soft Card Style (Claymorphism/Marshmallow) */
        .card-3d {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            border: 8px solid #FFF0F0;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.3), inset 0 -10px 20px rgba(255, 228, 225, 0.5);
        }

        /* 3D Button Utility Classes */
        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 transparent !important;
        }

        /* Sticky Notes */
        .sticky-note {
            position: absolute;
            box-shadow: 3px 8px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: grab;
            user-select: none;
            border-bottom-right-radius: 12px;
        }
        .sticky-note::after {
            content: "";
            position: absolute;
            bottom: 0; right: 0;
            border-width: 12px;
            border-style: solid;
            border-color: rgba(0,0,0,0.05) white white rgba(0,0,0,0.05);
            border-bottom-right-radius: 12px;
        }
        .sticky-note:active {
            cursor: grabbing;
            transform: scale(1.1) rotate(3deg) !important;
            box-shadow: 5px 15px 25px rgba(0,0,0,0.15);
            z-index: 100 !important;
        }
        .pin {
            width: 16px; height: 16px;
            background: radial-gradient(circle at 30% 30%, #FF9A9E, #FF6F69);
            border-radius: 50%; position: absolute; top: -5px; left: 50%;
            transform: translateX(-50%);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2), 2px 4px 5px rgba(0,0,0,0.3);
        }
        
        /* Animations */
        .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { 
            0% { opacity: 0; transform: translateY(30px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.7); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        
        .float-bg { animation: float 8s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .particle {
            position: absolute; pointer-events: none;
            animation: particleAnim 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes particleAnim {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(45deg); }
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col items-center justify-center text-[#594A4E]">

    <!-- Dekorasi Background -->
    <div class="fixed top-12 left-10 text-5xl float-bg opacity-60 z-0 select-none">✨</div>
    <div class="fixed bottom-24 right-10 text-6xl float-bg opacity-50 z-0 select-none" style="animation-delay: 2s;">💖</div>
    <div class="fixed top-1/4 right-8 text-4xl float-bg opacity-60 z-0 select-none" style="animation-delay: 1s;">🌸</div>
    <div class="fixed bottom-16 left-1/4 text-5xl float-bg opacity-50 z-0 select-none" style="animation-delay: 3s;">🎀</div>

    <!-- Canvas Tempat Sticky Notes Menempel -->
    <div id="sticky-canvas" class="absolute inset-0 z-0 overflow-hidden"></div>

    <!-- Main Game Card -->
    <div id="game-container" class="z-10 w-11/12 max-w-md card-3d p-6 md:p-8 flex flex-col items-center text-center hidden">
        
        <!-- Area Judul & Progress -->
        <div class="w-full mb-6">
            <h1 id="game-title" class="text-3xl font-black text-[#FF6F69] drop-shadow-sm mb-4 select-none">
                Truth or Truth? 🤫
            </h1>
            
            <!-- Visual Progress Bar -->
            <div class="flex justify-between items-center mb-2 px-1">
                <span id="progress-text" class="text-xs font-black text-gray-400 uppercase tracking-widest">Lvl 1/21</span>
                <span id="category-text" class="text-xs font-black text-white bg-[#FF9A9E] px-4 py-1.5 rounded-full shadow-sm">KATEGORI</span>
            </div>
            <div class="w-full bg-[#FFF0F0] rounded-full h-4 p-1 overflow-hidden shadow-inner border border-[#FFE4E1]">
                <div id="progress-bar-fill" class="bg-gradient-to-r from-[#FF9A9E] to-[#FF6F69] h-full rounded-full transition-all duration-700 ease-out shadow-sm" style="width: 5%"></div>
            </div>
        </div>
        
        <!-- Pertanyaan Dinamis -->
        <div id="question-wrapper" class="w-full fade-in-up">
            <h2 id="question-text" class="text-[1.1rem] md:text-lg font-bold text-gray-700 mb-6 min-h-[90px] flex items-center justify-center leading-relaxed">
                <!-- Teks diinjeksi via JS -->
            </h2>
            
            <!-- Area Input Dinamis -->
            <div id="input-area" class="w-full flex flex-col items-center space-y-4 min-h-[160px] justify-center">
                <!-- Inputs diinjeksi via JS -->
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="z-50 absolute inset-0 bg-[#FFF5F5] flex flex-col items-center justify-center">
        <div class="animate-bounce text-6xl mb-6 drop-shadow-md">🎀</div>
        <div class="flex space-x-3">
            <div class="w-4 h-4 bg-[#FF9A9E] rounded-full animate-pulse"></div>
            <div class="w-4 h-4 bg-[#FF6F69] rounded-full animate-pulse delay-75"></div>
            <div class="w-4 h-4 bg-[#FF9A9E] rounded-full animate-pulse delay-150"></div>
        </div>
        <p class="mt-6 text-xl font-black text-[#FF6F69] tracking-wide">Membuka Kotak...</p>
    </div>

    <!-- Custom Pop-up Modal (Untuk Hasil Tes) -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="card-3d p-6 md:p-8 w-full max-w-sm text-center pop-in relative">
            <div class="text-6xl mb-4 drop-shadow-md">✨</div>
            <h3 id="modal-title" class="text-2xl font-black text-[#FF6F69] mb-4">Hasil</h3>
            <p id="modal-message" class="text-gray-600 mb-8 font-bold leading-relaxed text-sm md:text-base bg-[#FFF5F5] p-4 rounded-2xl"></p>
            <button id="modal-close-btn" class="btn-3d w-full bg-[#FF6F69] text-white font-black py-4 rounded-[20px] shadow-[0_6px_0_#D9534F] text-lg uppercase tracking-wider">
                Lanjut!
            </button>
        </div>
    </div>

    <script>
        // =========================================================
        // NOMOR WA SUDAH DIUPDATE SESUAI PERMINTAAN
        // =========================================================
        const MY_PHONE_NUMBER = "628886753339"; 
        
        // Array untuk menyimpan jawaban secara lokal di HP dia
        let userAnswers = [];

        // --- DAFTAR PERTANYAAN ---
        const questions = [
            {"cat": "✈️ DREAM GETAWAY", "type": "text", "q": "Kalo kita dikasih tiket gratis buat chill berdua doang, tempat wisata atau daerah mana di Indonesia yang pengen banget kamu kunjungin bareng aku?"},
            {"cat": "🚪 SURPRISE VISIT", "type": "text", "q": "Andai aja besok aku tiba-tiba pulang dan ada di depan rumah kamu. Apa kegiatan utama yang pengen banget kamu lakuin bareng aku seharian?"},
            {"cat": "🎨 ART ATTACK", "type": "draw", "q": "Coba tes bakat senimu! Gambarin bentuk hati (Love) di kotak putih di bawah ini. Kalo jelek, utang traktir es krim!"},
            {"cat": "🎚️ CEK OMBAK", "type": "slider", "q": "Jujur, seberapa kangen kamu sama aku hari ini? Geser bar-nya sejujur mungkin!"},
            {"cat": "🥺 SECRET FEELING", "type": "text", "q": "Jujur-jujuran ya, hal kecil atau kebiasaan receh apa dari aku yang diem-diem paling kamu kangenin kalau kita lagi jauh?"},
            {"cat": "⚡ THIS OR THAT", "type": "choice2", "q": "Pilih liburan berdua: Ke gunung tapi hujan terus, atau ke pantai tapi panas banget sampai gosong?", "options": ["Gunung (Hujan 🌧️)", "Pantai (Gosong ☀️)"]},
            {"cat": "🧠 TRIVIA KITA", "type": "text", "q": "Coba test ingatan! Kapan dan di mana pertama kali banget kita ketemu? Awas aja kalo salah!"},
            
            // Tantangan PAP disisipkan di tengah
            {"cat": "📸 PAP VIBE CHECK", "type": "wa_pap", "q": "STOP DULU! Coba kirim PAP muka kamu ke WA aku sekarang. TAPI gayanya harus niruin 1 emoji yang paling ngegambarin *mood* kamu pas ngerjain kuis ini! (Misal: 🤪, 🫠, atau 🥹)"},
            
            {"cat": "💖 DEEP TALK", "type": "text", "q": "Coba inget-inget... di momen apa kamu pertama kali ngerasa 'Wah, aku beneran sayang banget nih sama dia'?"},
            {"cat": "👆 MINI GAME", "type": "clicker", "q": "UJI KECEPATAN JARI! Pencet tombol spam di bawah 15 kali secepat mungkin! (Siap-siap pegel)"},
            {"cat": "🎵 SOUNDTRACK KITA", "type": "text", "q": "Kalau hubungan kita ini dibikin film bioskop, lagu apa yang paling cocok buat diputer pas endingnya?"},
            {"cat": "🔮 GACHA NASIB", "type": "gacha", "q": "Klik tombol Gacha untuk lihat ramalan hubungan kita buat TAHUN DEPAN! Dilarang protes sama hasilnya!"},
            {"cat": "🎁 MAKE A WISH", "type": "text", "q": "Kalau sekarang ini aku bisa ngabulin 1 permintaan kamu (bisa makanan, barang, atau apa aja), kamu lagi pengen apa banget dari aku?"},
            
            // 8 Opsi Aksesoris
            {"cat": "🛍️ OUTFIT CHECK", "type": "choiceGrid", "q": "Misal kita lagi di mall, terus aku nyuruh kamu pilih 1 barang buat jajan / nambahin outfit kamu. Kamu bakal lari ke rak mana?", 
             "options": ["Liptint/MakeUp 💄", "Blindbox Kejutan 🎁", "Cincin / Kalung 💍", "Jam Tangan ⌚", "Cardigan Rajut 👗", "Tumbler Lucu 🥤", "Tas Selempang 👜", "Sepatu/Sandal 🥿"]},
            
            {"cat": "💅 NAIL ART VIBES", "type": "text", "q": "Ngomong-ngomong soal styling, kalo misal besok kita nyalon bareng, kamu pengen bikin Nail Art tema apa atau warna apa buat kuku kamu?"},
            
            // Tes Kepribadian Jari (Jebakan Cincin)
            {"cat": "💍 TES KEPRIBADIAN", "type": "ring_test", "q": "Tes Sifat dari Jari!\nCewek biasanya punya 1 jari favorit buat pake cincin. Kamu pilih jari apa? Masukkan ukurannya juga, biar sistem ngebaca aura sifat aslimu!"},
            
            {"cat": "🏆 PROUD OF YOU", "type": "text", "q": "Selama kita bareng, hal apa dari diri kamu sendiri yang kamu ngerasa berubah jadi jauh lebih baik gara-gara hubungan ini?"},
            {"cat": "⚡ THIS OR THAT", "type": "choice2", "q": "Jujur, mending LDR tapi sering dikirimin makanan/kado tiap minggu, atau sekota tapi ketemunya cuma bisa sebulan sekali?", "options": ["LDR (Banyak Kado 🎁)", "Sekota (Jarang Ketemu 🥲)"]},
            
            {"cat": "🎤 DARE", "type": "wa_dare", "q": "Klik tombol WhatsApp di bawah, rekam VN nyanyiin 1 bait lagu kesukaanmu kirim ke aku SEKARANG! (Kalo udah, balik ke sini klik Selesai)"},
            
            {"cat": "🤫 FIRST IMPRESSION", "type": "text", "q": "First impression kamu pas pertama kali ngeliat/kenal aku? Jujur aja gapapa, jangan ditutup-tutupin wkwk!"},
            {"cat": "💌 FINAL WISH", "type": "text", "q": "Kartu Terakhir! Tulis satu harapan paling tulus dari hati kamu buat kita berdua ke depannya!"}
        ];

        let currentIndex = 0;
        const stickyColors = ["#FFE3E3", "#E3F2FD", "#E8F5E9", "#FFF9C4", "#F3E5F5", "#FFECB3"];
        let clickCount = 0;
        let modalCallback = null;

        // Inisialisasi Game (Tanpa Firebase)
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('game-container').classList.remove('hidden');
                loadQuestion();
            }, 1500); // Fake loading biar ada sensasi gamenya
        };

        function showModal(title, message, callback) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
            modalCallback = callback;
        }

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('custom-modal').classList.add('hidden');
            if (modalCallback) {
                const cb = modalCallback;
                modalCallback = null;
                cb();
            }
        });

        function triggerConfetti(x, y) {
            const emojis = ['✨', '💖', '🎉', '🌸', '🎀'];
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                p.className = 'particle text-2xl md:text-3xl z-50';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const tx = (Math.random() - 0.5) * 250 + 'px';
                const ty = (Math.random() - 1) * 250 + 'px';
                p.style.setProperty('--tx', tx);
                p.style.setProperty('--ty', ty);
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function loadQuestion() {
            const inputArea = document.getElementById('input-area');
            const wrapper = document.getElementById('question-wrapper');
            inputArea.innerHTML = '';
            
            // Re-trigger animasi masuk
            wrapper.classList.remove('fade-in-up');
            void wrapper.offsetWidth;
            wrapper.classList.add('fade-in-up');

            // Update Progress Bar
            const percent = ((currentIndex) / questions.length) * 100;
            document.getElementById('progress-bar-fill').style.width = `${Math.max(5, percent)}%`;
            document.getElementById('progress-text').innerText = `Lvl ${Math.min(currentIndex + 1, questions.length)}/${questions.length}`;

            // JIKA GAME SELESAI - GENERATE PESAN WA OTOMATIS
            if (currentIndex >= questions.length) {
                document.getElementById('category-text').innerText = "SELESAI!";
                document.getElementById('progress-bar-fill').style.width = '100%';
                document.getElementById('question-text').innerHTML = "🎉 Yey! Semua Misi Selesai! 🎉<br><br><span class='text-sm text-gray-500'>Klik tombol di bawah buat ngirim hasil kuis ini ke aku dan klaim hadiahmu!</span>";
                
                // Menyusun teks laporan
                let waMsg = "Halo sayang! Ini hasil laporan kuis gabut aku hari ini: 💖%0A%0A";
                userAnswers.forEach((ans, i) => {
                    waMsg += `*${i+1}. ${ans.category}*%0A📝 Jawab: _${ans.answer}_%0A%0A`;
                });
                waMsg += "Buruan dibaca ya! Terus mana nih hadiah buat akunya? 👀🎁";

                const finishBtn = document.createElement('a');
                finishBtn.href = `https://wa.me/${MY_PHONE_NUMBER}?text=${waMsg}`;
                finishBtn.target = "_blank";
                finishBtn.className = "btn-3d w-full bg-[#25D366] text-white font-black py-5 rounded-[20px] shadow-[0_6px_0_#128C7E] active:shadow-[0_0px_0_#128C7E] text-center flex items-center justify-center mt-2 text-xl gap-2";
                finishBtn.innerHTML = "<span class='text-2xl'>🟢</span> Kirim Hasil ke WA Ayang!";
                
                inputArea.appendChild(finishBtn);
                return;
            }

            const data = questions[currentIndex];
            document.getElementById('category-text').innerText = data.cat;
            document.getElementById('question-text').innerText = data.q;

            const qType = data.type;

            if (qType === "text") {
                const input = document.createElement('textarea');
                input.className = "w-full p-4 rounded-[20px] border-4 border-[#FFF0F0] bg-gray-50 focus:bg-white focus:outline-none focus:border-[#FF9A9E] resize-none transition-all text-gray-700 font-bold shadow-inner";
                input.rows = 3; input.placeholder = "Ketik jawabanmu di sini...";
                
                const btn = document.createElement('button');
                btn.className = "btn-3d w-full bg-[#FF6F69] text-white font-black py-4 rounded-[20px] shadow-[0_6px_0_#D9534F] mt-4 text-lg";
                btn.innerText = "Catat! 💌";
                btn.onclick = (e) => {
                    if(input.value.trim() === "") { showModal("Oops!", "Hayo, jangan dikosongin dong sayang! 🙈"); return; }
                    triggerConfetti(e.clientX, e.clientY);
                    submitAnswer(input.value);
                };
                inputArea.appendChild(input); inputArea.appendChild(btn);
            } 
            else if (qType === "choice2") { 
                const flexDiv = document.createElement('div');
                flexDiv.className = "flex flex-col space-y-4 w-full pt-2";
                data.options.forEach((opt, idx) => {
                    const colors = idx === 0 ? "bg-[#FF9A9E] shadow-[0_6px_0_#FF6F69]" : "bg-[#81C784] shadow-[0_6px_0_#66BB6A]";
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full text-white font-black py-4 rounded-[20px] text-lg ${colors}`;
                    btn.innerText = opt;
                    btn.onclick = (e) => { triggerConfetti(e.clientX, e.clientY); submitAnswer(`Memilih: ${opt}`); };
                    flexDiv.appendChild(btn);
                });
                inputArea.appendChild(flexDiv);
            }
            else if (qType === "choiceGrid") { 
                const gridDiv = document.createElement('div');
                gridDiv.className = "grid grid-cols-2 gap-3 w-full";
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "btn-3d w-full bg-white text-gray-700 font-bold text-[13px] md:text-sm p-2 rounded-2xl border-4 border-[#FFF0F0] shadow-[0_4px_0_#FFE4E1] h-16 flex items-center justify-center text-center";
                    btn.innerText = opt;
                    btn.onclick = (e) => { triggerConfetti(e.clientX, e.clientY); submitAnswer(`Pilih Rak: ${opt}`); };
                    gridDiv.appendChild(btn);
                });
                inputArea.appendChild(gridDiv);
            }
            
            else if (qType === "ring_test") {
                const selectDiv = document.createElement('select');
                selectDiv.className = "w-full p-4 rounded-[20px] border-4 border-[#FFF0F0] bg-gray-50 mb-3 focus:outline-none focus:border-[#FF9A9E] text-gray-700 font-bold appearance-none";
                selectDiv.innerHTML = '<option value="" disabled selected>Pilih Jari Favoritmu...</option><option value="Telunjuk">Jari Telunjuk ☝️</option><option value="Tengah">Jari Tengah ✌️</option><option value="Manis">Jari Manis 💍</option><option value="Kelingking">Jari Kelingking 🤙</option>';

                const sizeInput = document.createElement('input');
                sizeInput.type = "number";
                sizeInput.placeholder = "Berapa ukurannya? (Misal: 10, 12, 14)";
                sizeInput.className = "w-full p-4 rounded-[20px] border-4 border-[#FFF0F0] bg-gray-50 mb-5 focus:outline-none focus:border-[#FF9A9E] text-gray-700 font-bold text-center";

                const btn = document.createElement('button');
                btn.className = "btn-3d w-full bg-gradient-to-r from-[#81C784] to-[#66BB6A] text-white font-black py-4 rounded-[20px] shadow-[0_6px_0_#4CAF50] text-lg";
                btn.innerText = "Lihat Sifat Asliku! ✨";
                btn.onclick = (e) => {
                    if(!selectDiv.value || !sizeInput.value) { showModal("Tunggu!", "Isi jari sama ukurannya dulu dong! 👀"); return; }
                    
                    let sifat = "";
                    if(selectDiv.value === "Telunjuk") sifat = "Berdasarkan ukuran & jari: Kamu tegas, mandiri, jiwa pemimpin tinggi, tapi ujung-ujungnya gampang luluh kalau disogok es krim! 🍦";
                    else if(selectDiv.value === "Tengah") sifat = "Berdasarkan ukuran & jari: Realistis, tenang, tapi diem-diem manja dan clingy parah kalau lagi berduaan! 🥺";
                    else if(selectDiv.value === "Manis") sifat = "Berdasarkan ukuran & jari: Wah! Kamu super romantis, penyayang, sangat setia, dan bucin maksimal! 🥰 Cieee!";
                    else sifat = "Berdasarkan ukuran & jari: Kamu orang yang unik, out of the box, dan kelakuanmu kadang random susah ditebak! 🤪";

                    showModal("✨ Hasil Tes Kepribadian", sifat, () => {
                         triggerConfetti(e.clientX, e.clientY);
                         submitAnswer(`JARI: ${selectDiv.value} | UKURAN: ${sizeInput.value}`);
                    });
                };
                
                inputArea.appendChild(selectDiv); inputArea.appendChild(sizeInput); inputArea.appendChild(btn);
            }
            else if (qType === "slider") {
                const valDisplay = document.createElement('div');
                valDisplay.className = "font-black text-4xl text-[#FF6F69] mb-4 drop-shadow-sm"; 
                valDisplay.innerText = "50%";

                const sliderWrapper = document.createElement('div');
                sliderWrapper.className = "w-full relative py-4";
                
                const slider = document.createElement('input');
                slider.type = "range"; slider.min = 0; slider.max = 100; slider.value = 50;
                slider.className = "w-full h-4 bg-[#FFF0F0] rounded-full appearance-none cursor-pointer accent-[#FF6F69] shadow-inner";
                slider.oninput = () => valDisplay.innerText = `${slider.value}%`;
                sliderWrapper.appendChild(slider);

                const btn = document.createElement('button');
                btn.className = "btn-3d w-full mt-4 bg-gradient-to-r from-[#FFB6C1] to-[#FF9A9E] text-white font-black py-4 rounded-[20px] shadow-[0_6px_0_#FF6F69] text-lg";
                btn.innerText = "Kunci Jawaban";
                btn.onclick = (e) => { triggerConfetti(e.clientX, e.clientY); submitAnswer(`Level Kangen: ${slider.value}%`); };

                inputArea.appendChild(valDisplay); inputArea.appendChild(sliderWrapper); inputArea.appendChild(btn);
            }
            else if (qType === "clicker") {
                clickCount = 0;
                const btn = document.createElement('button');
                btn.className = "btn-3d w-full bg-gradient-to-b from-[#FF6B6B] to-[#EE5253] text-white font-black py-6 rounded-[24px] shadow-[0_8px_0_#C0392B] text-2xl tracking-wider";
                btn.innerText = "SPAM KLIK! (0/15)";
                btn.onclick = (e) => {
                    clickCount++; btn.innerText = `SPAM KLIK! (${clickCount}/15)`;
                    if(clickCount >= 15) { triggerConfetti(e.clientX, e.clientY); submitAnswer("Berhasil clicker 15 kali! ⚡"); }
                };
                inputArea.appendChild(btn);
            }
            else if (qType === "wa_dare" || qType === "wa_pap") {
                const isPap = qType === "wa_pap";
                const waText = isPap ? "Halo sayang, ini PAP muka aku dengan emoji [isi emotnya di sini] pas ngerjain kuis dari kamu! 📸" : "Halo sayang, ini aku mau ngirim VN nyanyi buat kamu... dengerin ya! 🎤";
                
                const waBtn = document.createElement('a');
                waBtn.href = `https://wa.me/${MY_PHONE_NUMBER}?text=${encodeURIComponent(waText)}`;
                waBtn.target = "_blank"; 
                waBtn.className = "btn-3d w-full bg-[#25D366] text-white font-black py-4 rounded-[20px] shadow-[0_6px_0_#128C7E] text-center flex items-center justify-center mb-5 text-lg gap-2";
                waBtn.innerHTML = "<span class='text-2xl'>🟢</span> Buka WhatsApp Sekarang";

                const doneBtn = document.createElement('button');
                doneBtn.className = "btn-3d w-full bg-white border-4 border-[#FFF0F0] text-gray-500 font-bold py-3 rounded-[20px] shadow-[0_4px_0_#FFE4E1]";
                doneBtn.innerText = isPap ? "Udah Kirim PAP! 📸" : "Udah Kirim VN! 🎤";
                doneBtn.onclick = (e) => { triggerConfetti(e.clientX, e.clientY); submitAnswer(isPap ? "Kirim PAP emoji! 📸" : "Kirim VN nyanyi! 🎶"); };
                
                inputArea.appendChild(waBtn); inputArea.appendChild(doneBtn);
            }
            else if (qType === "gacha") {
                const btn = document.createElement('button');
                btn.className = "btn-3d w-full bg-gradient-to-r from-[#B5EAD7] to-[#8AD3BA] text-[#594A4E] font-black py-5 rounded-[20px] shadow-[0_6px_0_#62BCA0] text-xl";
                btn.innerText = "🎲 Putar Gacha Nasib 🎲";
                btn.onclick = (e) => {
                    const ramalan = [
                        "Tahun depan bakal sering jalan-jalan jauh berdua! ✈️", "Akan ada kejutan manis tak terduga dalam waktu dekat... 👀",
                        "Siap-siap, rezeki nomplok buat kalian berdua tahun depan! 💸", "Makin bucin parah, sampe temen-temen kalian enek liatnya! 💖",
                        "Bakal dapet rezeki liburan gratis ke tempat impian! 🏝️", "Hubungan makin langgeng, tapi bakal sering ribut rebutan makanan 🍕",
                        "Tahun depan berat badan kalian berdua bakal naik barengan! 📈", "Ada yang bakal ngasih hadiah super spesial yang diidam-idamkan 🎁",
                        "Kalian bakal keracunan hobi baru yang sama! 🎮", "Akan ada momen deep talk yang bikin makin sayang banget 🥺"
                    ];
                    const hasil = ramalan[Math.floor(Math.random() * ramalan.length)];
                    showModal("🎲 Hasil Ramalan", hasil, () => { triggerConfetti(e.clientX, e.clientY); submitAnswer(`Gacha: ${hasil}`); });
                };
                inputArea.appendChild(btn);
            }
            else if (qType === "draw") {
                const canvasWrap = document.createElement('div');
                canvasWrap.className = "border-4 border-[#FFF0F0] rounded-[24px] overflow-hidden w-full flex justify-center bg-white mb-4";
                canvasWrap.style.touchAction = "none"; 
                
                const cvs = document.createElement('canvas');
                cvs.width = 280; cvs.height = 140;
                cvs.className = "cursor-crosshair w-full h-full";
                canvasWrap.appendChild(cvs);

                const ctx = cvs.getContext('2d');
                ctx.fillStyle = "white"; ctx.fillRect(0, 0, cvs.width, cvs.height);
                let isDrawing = false;
                
                const start = (e) => { isDrawing = true; ctx.beginPath(); const rect = cvs.getBoundingClientRect(); ctx.moveTo((e.touches ? e.touches[0].clientX : e.clientX) - rect.left, (e.touches ? e.touches[0].clientY : e.clientY) - rect.top); e.preventDefault(); };
                const draw = (e) => { if(!isDrawing) return; const rect = cvs.getBoundingClientRect(); ctx.lineTo((e.touches ? e.touches[0].clientX : e.clientX) - rect.left, (e.touches ? e.touches[0].clientY : e.clientY) - rect.top); ctx.strokeStyle = "#FF6F69"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.stroke(); e.preventDefault(); };
                const stop = () => isDrawing = false;

                cvs.addEventListener('mousedown', start); cvs.addEventListener('mousemove', draw); cvs.addEventListener('mouseup', stop); cvs.addEventListener('mouseout', stop);
                cvs.addEventListener('touchstart', start, {passive: false}); cvs.addEventListener('touchmove', draw, {passive: false}); cvs.addEventListener('touchend', stop);

                const btnRow = document.createElement('div');
                btnRow.className = "flex space-x-3 w-full";

                const clearBtn = document.createElement('button');
                clearBtn.className = "btn-3d flex-1 bg-gray-200 text-gray-600 font-bold py-3 rounded-[16px] shadow-[0_4px_0_#D1D5DB]";
                clearBtn.innerText = "Hapus 🗑️";
                clearBtn.onclick = () => { ctx.fillStyle = "white"; ctx.fillRect(0, 0, cvs.width, cvs.height); };

                const doneBtn = document.createElement('button');
                doneBtn.className = "btn-3d flex-[2] bg-gradient-to-r from-[#FFD3B6] to-[#FFAAA5] text-[#594A4E] font-black py-3 rounded-[16px] shadow-[0_4px_0_#E88B86]";
                doneBtn.innerText = "Selesai Gambar! 🎨";
                doneBtn.onclick = (e) => { triggerConfetti(e.clientX, e.clientY); submitAnswer("Menggambar hati! 🎨"); };

                btnRow.appendChild(clearBtn); btnRow.appendChild(doneBtn);
                inputArea.appendChild(canvasWrap); inputArea.appendChild(btnRow);
            }
        }

        function submitAnswer(answer) {
            const currentQ = questions[currentIndex];
            
            // Simpan jawaban ke dalam Array Lokal
            userAnswers.push({
                category: currentQ.cat,
                question: currentQ.q,
                answer: answer
            });

            createStickyNote(currentQ.cat, answer);
            currentIndex++;
            setTimeout(() => { loadQuestion(); }, 300);
        }

        function createStickyNote(title, text) {
            const canvas = document.getElementById('sticky-canvas');
            const note = document.createElement('div');
            const color = stickyColors[Math.floor(Math.random() * stickyColors.length)];
            
            note.className = "sticky-note w-32 md:w-36 p-3 pb-4 flex flex-col items-center justify-center text-center fade-in-up border-2 border-white/50";
            note.style.backgroundColor = color;
            
            const rot = Math.random() * 20 - 10;
            const x = Math.max(20, Math.random() * (window.innerWidth - 180));
            const y = Math.max(20, Math.random() * (window.innerHeight - 180));
            
            note.style.left = `${x}px`; note.style.top = `${y}px`; note.style.transform = `rotate(${rot}deg)`;
            
            const pin = document.createElement('div'); pin.className = "pin"; note.appendChild(pin);
            const titleEl = document.createElement('div');
            titleEl.className = "font-black text-[10px] text-[#594A4E] mt-3 mb-1 border-b-2 border-white/60 w-full tracking-wider opacity-60";
            titleEl.innerText = title.replace(/[^a-zA-Z\s]/g, '').trim();
            
            const textEl = document.createElement('div');
            textEl.className = "text-[11px] md:text-xs font-bold text-gray-800 break-words w-full leading-tight";
            textEl.innerText = text.length > 50 ? text.substring(0,50) + "..." : text;

            note.appendChild(titleEl); note.appendChild(textEl);
            
            let isDragging = false; let startX, startY, initialLeft, initialTop;
            const onPointerDown = (e) => {
                isDragging = true; note.style.zIndex = 50;
                startX = e.clientX || (e.touches && e.touches[0].clientX); startY = e.clientY || (e.touches && e.touches[0].clientY);
                initialLeft = parseFloat(note.style.left); initialTop = parseFloat(note.style.top);
            };
            const onPointerMove = (e) => {
                if (!isDragging) return;
                const currentX = e.clientX || (e.touches && e.touches[0].clientX); const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                note.style.left = `${initialLeft + (currentX - startX)}px`; note.style.top = `${initialTop + (currentY - startY)}px`;
            };
            const onPointerUp = () => { isDragging = false; note.style.zIndex = 1; };

            note.addEventListener('mousedown', onPointerDown); document.addEventListener('mousemove', onPointerMove); document.addEventListener('mouseup', onPointerUp);
            note.addEventListener('touchstart', onPointerDown, {passive: true}); document.addEventListener('touchmove', onPointerMove, {passive: true}); document.addEventListener('touchend', onPointerUp);
            canvas.appendChild(note);
        }
    </script>
</body>
